<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分镜生成器</title>
    <script>
      /* 启动期错误直接画在页面上，避免「点了没反应」式静默失败 */
      window.__sbShowError = function (msg) {
        var b = document.getElementById("boot-errors");
        if (!b) {
          b = document.createElement("div");
          b.id = "boot-errors";
          b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#7a1f1f;color:#fff;font:12px/1.5 monospace;padding:8px 12px;white-space:pre-wrap;max-height:45vh;overflow:auto";
          (document.body || document.documentElement).appendChild(b);
        }
        b.textContent += msg + "\n";
      };
      window.addEventListener("error", function (e) {
        window.__sbShowError("错误: " + (e.message || e.type) + "  @ " + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        window.__sbShowError("Promise: " + ((r && r.stack) || (r && r.message) || r));
      });
    </script>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="btn-new" disabled title="P5">新建</button>
        <button id="btn-open" disabled title="P5">打开</button>
        <button id="btn-save" disabled title="P5">保存</button>
        <div class="sep"></div>
        <button id="btn-import" class="accent" disabled title="P5">导入AI JSON</button>
        <button id="btn-prompt" class="accent" disabled title="P5">复制AI提示词</button>
        <div class="sep"></div>
        <button id="btn-undo" disabled title="Ctrl+Z（P2）">撤销</button>
        <button id="btn-redo" disabled title="Ctrl+Shift+Z（P2）">重做</button>
        <div class="sep"></div>
        <button id="btn-png" disabled title="P5">导出PNG</button>
        <button id="btn-sheet" disabled title="逐行图片表格：效果图 / 灯位图 / 机位 / 描述">分镜表 PNG</button>
        <button id="btn-sheet-csv" disabled title="一行一镜的 CSV，可用 Excel / WPS 编辑">分镜表 CSV</button>
        <button id="btn-lightmap" disabled title="P5">灯位图</button>
        <div class="sep"></div>
        <button id="btn-view" disabled title="Tab：机位视图 ⇄ 导演视图（飞行中切换会接着飞）">切换视角</button>
        <div class="sep"></div>
        <label>画幅
          <select id="aspect">
            <option>3:2</option><option>4:3</option><option selected>16:9</option>
            <option>4:5</option><option>1:1</option><option>9:16</option><option>2.39:1</option>
          </select>
        </label>
        <label>机身
          <select id="sensor" title="只影响 HUD 显示的等效换算"></select>
        </label>
        <button id="btn-overlay" title="三分线 / HUD 开关">辅助线</button>
        <label><input type="checkbox" id="shadows" disabled title="P4" /> 阴影</label>
        <div class="spacer"></div>
        <span id="proj-title">未命名项目</span>
      </header>

      <aside id="shot-list">
        <div class="panel-title">镜头</div>
        <div id="shot-items"></div>
      </aside>

      <main id="viewport">
        <canvas id="view3d"></canvas>
      </main>

      <aside id="inspector">
        <div class="panel-title">属性</div>
        <div class="placeholder">属性面板 · P2 实现</div>
      </aside>

      <footer id="desc-bar">
        <div class="desc-left">
          <div class="desc-row">
            <input id="shot-name" placeholder="镜头名" />
            <label>时长 <input id="shot-duration" type="number" min="0.5" step="0.5" style="width:52px" /> s</label>
          </div>
          <textarea id="shot-desc" placeholder="本镜描述：画面内容、情绪、前景/背景、构图意图"></textarea>
        </div>
        <textarea id="shot-notes" placeholder="备注：灯光 / 服装 / 道具 / 台词"></textarea>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
